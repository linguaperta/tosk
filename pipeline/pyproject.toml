[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tosk-pipeline"
version = "0.1.0"
description = "tosk content pipeline: open data -> JSONL -> course.sqlite"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20", "requests>=2.31"]

[tool.setuptools]
packages = ["pipeline", "pipeline.hns"]

[tool.setuptools.package-data]
"pipeline.hns" = ["template/*.yaml", "template/grammar/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
