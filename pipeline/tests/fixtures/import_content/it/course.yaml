# Small course for the importer test (runs against tests/fixtures/cache, offline).
id: it
version: 0.0.1
title: {en: Italian (import test), nl: Italiaans (importtest)}
target: it
translations: [en, nl]
persons: [io, tu, lui/lei, noi, voi, loro]
tenses: [presente, imperfetto, futuro, passato_prossimo]
articles: [il, lo, la, "l'"]
units:
  - id: u1
    title: {en: Basics, nl: Basis}
    skills:
      - id: greetings
        kind: vocab
        title: {en: Greetings, nl: Begroetingen}
        items: {tags: [greetings]}
      - id: people
        kind: vocab
        title: {en: People, nl: Mensen}
        requires: [greetings]
        items: {tags: [people]}
      - id: present-are
        kind: grammar
        title: {en: Present -are, nl: Tegenwoordige tijd -are}
        requires: [greetings]
        verbs: {class: are, regular: true, tense: presente, min: 2}
  - id: u2
    title: {en: More, nl: Meer}
    skills:
      - id: articles
        kind: grammar
        title: {en: Articles, nl: Lidwoorden}
        requires: [people]
        facet: article
        items: {pos: noun, tags: [people, things]}
      - id: passato
        kind: grammar
        title: {en: Passato prossimo, nl: Passato prossimo}
        requires: [present-are]
        verbs: {tense: passato_prossimo, lemmas: [mangiare, parlare, andare]}
