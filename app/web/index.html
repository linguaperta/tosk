  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #F7F0E2;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #2B1F17;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>
  <script>
    // Offline app shell (web/sw.js). Installed from Safari's "Add to Home
    // Screen" on iOS, or the install prompt on Android/desktop.
    if ('serviceWorker' in navigator) {
      // A new deploy: its worker (sw.js changes with every deploy) takes over
      // a page that already had one. Tell the app, which offers a reload
      // (lib/updates/web_update.dart); the flag covers an app that starts
      // listening later. The first visit's own worker taking control is not
      // an update.
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) {
          hadController = true;
          return;
        }
        window.toskUpdateReady = true;
        window.dispatchEvent(new Event('tosk-update'));
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function () {
          return navigator.serviceWorker.ready;
        }).then(function (reg) {
          // Hand the worker what this visit loaded before it took control
          // (CanvasKit, fonts, ...), so the app also starts offline after a
          // single visit. Again a little later for what loads after start-up.
          function send() {
            if (!reg.active) return;
            var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            reg.active.postMessage({ type: 'tosk-cache-urls', urls: [location.href].concat(urls) });
          }
          send();
          setTimeout(send, 15000);
          // Look for a new deploy while the app stays open: hourly, and when
          // the tab comes back after ten minutes or more.
          var lastCheck = Date.now();
          function checkForUpdate() {
            lastCheck = Date.now();
            reg.update().catch(function () {});
          }
          setInterval(checkForUpdate, 60 * 60 * 1000);
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible' && Date.now() - lastCheck > 10 * 60 * 1000) checkForUpdate();
          });
        }).catch(function (e) { console.warn('[sw]', e); });
      });
    }
  </script>


</body></html>
