name: tosk
description: "tosk: a free, offline-first language-learning app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.7.6+19

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  uuid: ^4.6.0
  collection: ^1.19.1
  meta: ^1.19.0
  typed_data: ^1.4.0
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  audioplayers: ^6.8.1
  google_mlkit_digital_ink_recognition: ^0.16.1
  flutter_tts: ^4.2.5
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  archive: ^4.5.2
  web: ^1.1.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# The pub.dev flutter_secure_storage_windows builds a C++ plugin that needs ATL
# (atlstr.h), which plain Visual Studio Build Tools lack. This local package
# replaces it with a pure-Dart implementation (Windows Credential Manager via
# FFI), so no C++ is compiled for it. See docs/release.md.
dependency_overrides:
  flutter_secure_storage_windows:
    path: packages/secure_storage_windows_dart
  # flutter_local_notifications' Windows part builds a C++ plugin that needs
  # ATL (missing on this toolchain); reminders are Android/iOS/macOS only, so
  # a copy without the native part (registerWith is a no-op) stands in.
  flutter_local_notifications_windows:
    path: packages/local_notifications_windows_noop
  # flutter_tts (listening exercises, v0.5) is not federated, and its Windows
  # part builds C++ that needs ATL and nuget.exe: this copy is the same
  # package without the Windows plugin (no voice on Windows; the app hides
  # listening and pronounce buttons there).
  flutter_tts:
    path: packages/flutter_tts_no_windows

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Bundled course packs (python -m pipeline build ... --install); discovered
    # at runtime through the AssetManifest, so no per-file entries are needed.
    - assets/courses/
    - assets/config/focus_presets.json
    # Sound effects, synthesized by tool/make_sounds.py (no third-party audio).
    - assets/sounds/
    # Brand kit (docs/brand-overhaul.md): Tosk's poses and the map marker as
    # PNG (colour and -mono), and the branch style the map painter follows.
    - assets/brand/png/
    - assets/brand/branch-style.json

  # Gelasio (SIL Open Font License, assets/brand/fonts/OFL.txt): headings and
  # the tosk wordmark. Body text keeps the platform UI font.
  fonts:
    - family: Gelasio
      fonts:
        - asset: assets/brand/fonts/Gelasio[wght].ttf
        - asset: assets/brand/fonts/Gelasio-Bold.ttf
          weight: 700

# Launcher icons from the brand kit (assets/brand/icon/, see its README):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/icon/icon-1024.png
  android: true
  adaptive_icon_foreground: assets/brand/icon/adaptive-foreground.png
  adaptive_icon_background: "#F7F0E2"
  adaptive_icon_monochrome: assets/brand/icon/adaptive-monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/icon/icon-1024.png
    background_color: "#F7F0E2"
    theme_color: "#F7F0E2"
  windows:
    generate: true
    image_path: assets/brand/icon/icon-1024.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/brand/icon/icon-1024.png

# Splash screens (Tosk above the wordmark on paper; deep bark in the dark):
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F7F0E2"
  color_dark: "#2B1F17"
  image: assets/brand/icon/splash.png
  image_dark: assets/brand/icon/splash-dark.png
  android_12:
    color: "#F7F0E2"
    color_dark: "#2B1F17"
    image: assets/brand/icon/splash-android12.png
    image_dark: assets/brand/icon/splash-android12.png
  web: true
