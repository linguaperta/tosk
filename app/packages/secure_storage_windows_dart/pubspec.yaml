# Local replacement for the pub.dev flutter_secure_storage_windows, wired in
# with dependency_overrides in app/pubspec.yaml. The name must match the
# endorsed package so it replaces flutter_secure_storage's windows
# default_package. Pure Dart (dartPluginClass, no pluginClass), so no C++ is
# built and the Windows build does not need ATL. Secrets go to the Windows
# Credential Manager through FFI.
name: flutter_secure_storage_windows
description: Pure-Dart Windows implementation of flutter_secure_storage backed by the Windows Credential Manager.
version: 4.2.2+tosk.1
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: '>=3.19.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.1.0
  win32: ^6.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      windows:
        dartPluginClass: FlutterSecureStorageWindows
