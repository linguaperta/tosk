# Tests on every push and pull request: flutter analyze + flutter test (app and
# its local packages), the pipeline's pytest, and the Firestore security rules
# against the emulator.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  app:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test -j 4 --exclude-tags golden
      - name: Local packages
        run: |
          for pkg in packages/*/; do
            (cd "$pkg" && flutter pub get >/dev/null && flutter analyze && { [ ! -d test ] || flutter test; })
          done

  pipeline:
    name: Pipeline pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: pytest
        working-directory: pipeline
        env:
          # Tests use their own fixtures; no content checkout or download cache.
          TOSK_CONTENT: ${{ runner.temp }}/no-content
          TOSK_CACHE: ${{ runner.temp }}/cache
        run: python -m pytest -q
      - name: No restricted content tracked
        # Fails if a tracked *.sqlite carries meta.restricted or a restricted course id, or a
        # tracked path is named after a restricted course (pipeline/pipeline/restricted.py).
        working-directory: pipeline
        run: python -m pipeline.restricted

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      # The lockfile pins every package (and its integrity hash).
      - run: npm ci --no-audit --no-fund
      - run: npm test
