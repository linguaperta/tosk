# Tests on every push and pull request: flutter analyze + flutter test (app and
# its local packages), the pipeline's pytest, and the Firestore security rules
# against the emulator.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  app:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test -j 4
      - name: Local packages
        run: |
          for pkg in packages/*/; do
            (cd "$pkg" && flutter pub get >/dev/null && flutter analyze && flutter test)
          done

  pipeline:
    name: Pipeline pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: pytest
        working-directory: pipeline
        env:
          # Tests use their own fixtures; no content checkout or download cache.
          TOSK_CONTENT: ${{ runner.temp }}/no-content
          TOSK_CACHE: ${{ runner.temp }}/cache
        run: python -m pytest -q

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm test
